name: build

on:
  push:
    branches: [ dev, release/* ]
    tags: [ '*' ]
  pull_request:
    branches: [ dev, release/* ]
  workflow_dispatch:

env:
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  NUGET_XMLDOC_MODE: skip
  TERM: xterm
  ContinuousIntegrationBuild: true

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    outputs:
      dotnet-sdk-version: ${{ steps.setup-dotnet.outputs.dotnet-version }}

    permissions:
      attestations: write
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os: [ xcode-27, ubuntu-24.04, windows-2022 ]
        include:
        - os: xcode-27
          os_name: macos
        - os: ubuntu-24.04
          os_name: linux
        - os: windows-2022
          os_name: windows

    steps:
    - name: Checkout code
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: Select Xcode 27.2
      if: runner.os == 'macOS'
      shell: bash
      run: |
        export DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer
        xcodebuild -version
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
      id: setup-dotnet

    - name: Set package version
      shell: pwsh
      run: |
        $Version = dotnet msbuild src/OpenNetty/OpenNetty.csproj -getProperty:PreReleaseVersionLabel,PreReleaseVersionIteration,VersionSuffix
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to determine the version suffix (exit code $LASTEXITCODE)."
        }
        $Version = $Version | ConvertFrom-Json
        $Suffix = $Version.Properties.VersionSuffix

        if (-not $env:GITHUB_REF.StartsWith("refs/pull/") -and -not [string]::IsNullOrWhiteSpace($Version.Properties.PreReleaseVersionLabel)) {
          $Suffix = $Version.Properties.PreReleaseVersionLabel
          if (-not [string]::IsNullOrWhiteSpace($Version.Properties.PreReleaseVersionIteration)) {
            $Suffix += ".$($Version.Properties.PreReleaseVersionIteration)"
          }
          $Suffix += ".$env:GITHUB_RUN_NUMBER"
        }

        "VersionSuffix=$Suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore dependencies
      shell: pwsh
      run: dotnet restore --artifacts-path artifacts -p:Configuration=Release "-p:VersionSuffix=$env:VersionSuffix"

    - name: Build solution
      shell: pwsh
      run: dotnet build --configuration Release --no-restore --artifacts-path artifacts "-p:VersionSuffix=$env:VersionSuffix" -bl:artifacts/log/Release/build.binlog

    - name: Run tests
      shell: pwsh
      run: dotnet test --configuration Release --no-build --no-restore --artifacts-path artifacts "-p:VersionSuffix=$env:VersionSuffix" --results-directory artifacts/TestResults/Release

    - name: Pack NuGet packages
      shell: pwsh
      run: dotnet pack --configuration Release --no-build --no-restore --artifacts-path artifacts "-p:VersionSuffix=$env:VersionSuffix" "-p:PackageOutputPath=$env:GITHUB_WORKSPACE/artifacts/packages/Release/Shipping"

    - name: Attest artifacts
      uses: actions/attest-build-provenance@bdd51370e0416ac948727f861e03c2f05d32d78e # v1.3.2
      if: |
        runner.os == 'Windows' &&
        github.event.repository.fork == false &&
        startsWith(github.ref, 'refs/tags/')
      with:
        subject-path: |
          ./artifacts/bin/**/OpenNetty.*.dll
          ./artifacts/packages/Release/Shipping/*

    - name: Publish logs
      if: ${{ always() }}
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
      with:
        name: logs-${{ matrix.os_name }}
        path: ./artifacts/log/Release

    - name: Publish NuGet packages
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
      with:
        name: packages-${{ matrix.os_name }}
        path: ./artifacts/packages/Release/Shipping

    - name: Publish test results
      if: ${{ always() }}
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
      with:
        name: testresults-${{ matrix.os_name }}
        path: ./artifacts/TestResults/Release

  validate-packages:
    needs: build
    runs-on: ubuntu-24.04
    steps:
    - name: Download packages
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: packages-windows

    - name: Setup .NET
      uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
      with:
        dotnet-version: ${{ needs.build.outputs.dotnet-sdk-version }}

    - name: Validate NuGet packages
      shell: pwsh
      run: |
        dotnet tool install --global dotnet-validate --version 0.0.1-preview.304 --allow-roll-forward
        $packages = Get-ChildItem -Filter "*.nupkg" | ForEach-Object { $_.FullName }
        $invalidPackages = 0
        foreach ($package in $packages) {
          dotnet validate package local $package
          if ($LASTEXITCODE -ne 0) {
            $invalidPackages++
          }
        }
        if ($invalidPackages -gt 0) {
          Write-Output "::error::$invalidPackages NuGet package(s) failed validation."
          exit 1
        }
